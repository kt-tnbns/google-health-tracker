<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Health Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --page:#f5f6f3; --surface:#fcfcfb; --surface-2:#f0f1ed; --surface-3:#e8eae4; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --hair:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.07);
    --accent:#2a78d6; --accent-soft:#e6f0fb; --accent-ink:#1c5cab;
    --good:#0ca30c; --good-text:#006300; --warning:#fab219; --warn-text:#8a5a00; --critical:#d03b3b;
    --sleep-deep:#1c5cab; --sleep-rem:#3987e5; --sleep-light:#86b6ef; --sleep-awake:#c3c2b7;
    --s-hrv:#2a78d6; --s-rhr:#eb6834; --s-spo2:#1baf7a; --s-steps:#eda100; --s-azm:#e87ba4; --s-rr:#4a3aa7;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 10px 30px -14px rgba(20,30,40,.14);
    --r:18px;
  }
  @media (prefers-color-scheme: dark) { :root {
    color-scheme: dark;
    --page:#0e0e0d; --surface:#1a1a19; --surface-2:#222221; --surface-3:#2a2a28; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
    --hair:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.09);
    --accent:#3987e5; --accent-soft:#17304f; --accent-ink:#86b6ef; --good-text:#0ca30c; --warn-text:#fab219;
    --sleep-deep:#184f95; --sleep-rem:#3987e5; --sleep-light:#86b6ef; --sleep-awake:#4a4a47;
    --s-hrv:#3987e5; --s-rhr:#d95926; --s-spo2:#199e70; --s-steps:#c98500; --s-azm:#d55181; --s-rr:#9085e9;
    --shadow:none;
  } }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html { background:var(--page); scroll-behavior:smooth; }
  body { margin:0; color:var(--ink); font:14px/1.55 "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing:antialiased; }
  button, input, select, textarea { font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--axis); border-radius:12px; padding:8px 12px; }
  button { cursor:pointer; transition:background .15s, transform .08s; } button:hover { background:var(--surface-2); } button:active { transform:scale(.98); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; } button.primary:hover { filter:brightness(1.07); background:var(--accent); }
  button.ghost { border-color:transparent; background:transparent; } button.ghost:hover { background:var(--surface-2); }
  button:disabled { opacity:.5; cursor:default; transform:none; }
  .icon { width:36px; height:36px; padding:0; display:inline-grid; place-items:center; border-radius:10px; }
  .icon svg { width:18px; height:18px; }

  header { position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--hair); }
  .bar { max-width:1280px; margin:0 auto; padding:10px 20px; display:flex; align-items:center; gap:10px; }
  .brand { display:flex; align-items:center; gap:10px; margin-right:auto; min-width:0; }
  .brand svg { width:30px; height:30px; flex:none; }
  .brand b { font-size:16px; letter-spacing:-.01em; display:block; line-height:1.2; } .brand small { display:block; color:var(--muted); font-size:12px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .seg { display:inline-flex; background:var(--surface-2); border-radius:10px; padding:2px; }
  .seg button { border:0; background:transparent; padding:5px 10px; border-radius:8px; font-size:12px; font-weight:600; color:var(--muted); }
  .seg button.on { background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px; font-size:12px; border:1px solid var(--hair); color:var(--ink-2); background:var(--surface-2); white-space:nowrap; }
  .pill i { width:8px; height:8px; border-radius:50%; background:var(--muted); display:inline-block; flex:none; }
  .pill.ok i { background:var(--good); } .pill.warn i { background:var(--warning); } .pill.bad i { background:var(--critical); }
  .ok { color:var(--good-text); } .warn { color:var(--warn-text); } .bad { color:var(--critical); } .muted { color:var(--muted); }

  .layout { max-width:1280px; margin:0 auto; padding:20px; display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:20px; align-items:start; }
  main { display:grid; gap:16px; min-width:0; }
  .card { background:var(--surface); border:1px solid var(--ring); border-radius:var(--r); padding:18px 20px; box-shadow:var(--shadow); min-width:0; }
  h2 { font-size:13px; font-weight:600; color:var(--ink-2); margin:0 0 2px; }
  .sub { color:var(--muted); font-size:12px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .between { justify-content:space-between; }
  .banner { padding:10px 14px; border-radius:14px; background:var(--accent-soft); color:var(--ink-2); font-size:13px; }
  .banner.bad { background:color-mix(in srgb, var(--critical) 10%, var(--surface)); } .banner.warn { background:color-mix(in srgb, var(--warning) 16%, var(--surface)); }

  /* hero */
  .hero { display:grid; grid-template-columns:minmax(240px, 1fr) minmax(0, 1.9fr); gap:16px; }
  .hero-num { font-size:clamp(40px, 6vw, 54px); font-weight:600; letter-spacing:-.03em; line-height:1; margin:8px 0 4px; }
  .hero-num small { font-size:.4em; font-weight:500; color:var(--ink-2); margin:0 2px 0 4px; }
  .stage-bar { display:flex; height:14px; border-radius:7px; overflow:hidden; gap:2px; margin-top:12px; }
  .stage-bar span { display:block; height:100%; transition:width .4s ease; }
  .legend { display:flex; gap:12px 14px; flex-wrap:wrap; font-size:12px; color:var(--ink-2); margin-top:8px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px; }
  .tile { background:var(--surface-2); border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:2px; min-width:0; }
  .tile .label { font-size:12px; color:var(--ink-2); display:flex; align-items:center; gap:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile .label i { width:8px; height:8px; border-radius:50%; display:inline-block; flex:none; }
  .tile .value { font-size:24px; font-weight:600; letter-spacing:-.02em; line-height:1.15; }
  .tile .value small { font-size:12px; font-weight:500; color:var(--muted); margin-left:3px; }
  .tile .stale { font-size:11px; color:var(--muted); margin-top:-2px; }
  .tile .delta { font-size:12px; color:var(--ink-2); min-height:18px; }
  .tile svg { width:100%; height:38px; margin-top:6px; overflow:visible; }
  .missing { color:var(--muted); font-style:italic; font-size:14px; }
  .kpi-empty { padding:36px 0; text-align:center; color:var(--muted); }

  /* chart */
  .chart { position:relative; }
  .chart svg { width:100%; height:220px; display:block; overflow:visible; }
  .tip { position:absolute; pointer-events:none; background:var(--ink); color:var(--surface); padding:8px 10px; border-radius:10px; font-size:12px; line-height:1.45; white-space:nowrap; opacity:0; transition:opacity .12s; z-index:3; box-shadow:0 6px 20px rgba(0,0,0,.22); }
  .tip b { font-weight:600; } .tip .r { display:flex; justify-content:space-between; gap:14px; } .tip i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:6px; }

  /* tables */
  table { width:100%; border-collapse:collapse; font-size:13px; } th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--hair); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; font-size:12px; } td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  tbody tr:hover { background:var(--surface-2); }
  .wrap { overflow-x:auto; margin:8px -8px 0; padding:0 8px; -webkit-overflow-scrolling:touch; }
  a { color:var(--accent); cursor:pointer; text-decoration:none; } a:hover { text-decoration:underline; }
  pre { background:var(--surface-2); border-radius:12px; padding:14px; overflow:auto; max-height:60vh; font-size:12px; margin:12px 0 0; }
  details > summary { cursor:pointer; list-style:none; display:flex; align-items:center; gap:10px; } details > summary::-webkit-details-marker { display:none; }
  details > summary::after { content:"›"; margin-left:auto; color:var(--muted); font-size:20px; transform:rotate(90deg); transition:transform .15s; } details[open] > summary::after { transform:rotate(-90deg); }

  /* coach */
  aside.coach { position:sticky; top:74px; height:calc(100vh - 94px); display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--ring); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden; }
  .coach-head { padding:14px 16px; border-bottom:1px solid var(--hair); display:flex; align-items:center; gap:10px; }
  .coach-head .avatar { width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg, var(--accent), #7aa2ff); display:grid; place-items:center; color:#fff; flex:none; }
  .coach-head b { display:block; font-size:14px; } .coach-head small { color:var(--muted); font-size:12px; display:block; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .msgs { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:88%; padding:10px 14px; border-radius:16px; line-height:1.55; font-size:14px; animation:pop .18s ease-out; word-break:break-word; }
  .msg.user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:6px; white-space:pre-wrap; }
  .msg.ai { align-self:flex-start; background:var(--surface-2); border-bottom-left-radius:6px; }
  .msg.ai.err { border:1px solid color-mix(in srgb, var(--critical) 40%, transparent); }
  .msg .time { display:block; font-size:11px; opacity:.6; margin-top:4px; }
  .msg ul { margin:4px 0 0; padding-left:18px; } .msg li { margin:2px 0; } .msg p { margin:0 0 6px; } .msg p:last-child { margin:0; }
  @keyframes pop { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .typing { display:inline-flex; gap:4px; padding:12px 14px; } .typing i { width:6px; height:6px; border-radius:50%; background:var(--muted); animation:blink 1.2s infinite; } .typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink { 0%,80%,100% { opacity:.25; transform:translateY(0); } 40% { opacity:1; transform:translateY(-3px); } }
  .chips { display:flex; gap:8px; padding:0 16px 10px; overflow-x:auto; scrollbar-width:none; } .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; font-size:12px; padding:6px 12px; border-radius:999px; background:var(--surface-2); border:1px solid transparent; color:var(--ink-2); }
  .chip:hover { border-color:var(--axis); }
  .compose { display:flex; gap:8px; padding:12px 16px 16px; border-top:1px solid var(--hair); align-items:flex-end; }
  .compose textarea { flex:1; resize:none; max-height:140px; min-height:40px; border-radius:14px; padding:9px 14px; line-height:1.4; }
  .compose .icon { width:40px; height:40px; border-radius:12px; flex:none; }
  .coach-empty { margin:auto; text-align:center; color:var(--muted); padding:20px; font-size:13px; max-width:280px; }
  .fab { display:none; position:fixed; right:18px; bottom:calc(18px + env(safe-area-inset-bottom)); z-index:30; height:52px; padding:0 18px 0 14px; border-radius:26px; background:var(--accent); color:#fff; border:0; font-weight:600; box-shadow:0 10px 30px -8px rgba(42,120,214,.6); gap:8px; align-items:center; }
  .fab svg { width:20px; height:20px; }
  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:35; opacity:0; pointer-events:none; transition:opacity .3s; } .scrim.on { opacity:1; pointer-events:auto; }

  @media (max-width: 980px) {
    .layout { grid-template-columns:1fr; padding:14px; gap:14px; }
    aside.coach { position:fixed; left:0; right:0; bottom:0; top:auto; height:min(82vh, 720px); border-radius:22px 22px 0 0; transform:translateY(105%); transition:transform .32s cubic-bezier(.2,.8,.2,1); z-index:40; }
    aside.coach.open { transform:none; }
    .fab { display:inline-flex; }
    .hero { grid-template-columns:1fr; }
    .card { padding:14px 16px; border-radius:16px; }
    .bar { padding:10px 14px; gap:8px; }
    .brand small { display:none; }
  }
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect width="32" height="32" rx="10" fill="var(--accent)"/><path d="M6 17h5l2.5-6 4 11 2.5-5H26" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><b data-i18n="title">Health Coach</b><small id="todayLabel"></small></div>
  </div>
  <div class="seg" id="langSeg"><button data-lang="th">TH</button><button data-lang="en">EN</button></div>
  <span id="conn" class="pill"><i></i><span>…</span></span>
  <button id="tokBtn" class="icon ghost" title="admin token"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.85 12.15 19 4m-3 3 3 3"/></svg></button>
</div></header>

<div class="layout">
<main>
  <div id="tokenBox" class="card row" hidden><input id="tok" type="password" placeholder="admin token" style="flex:1; min-width:160px"><button id="save" class="primary" data-i18n="useToken">ใช้ token</button></div>
  <div id="banner" class="banner" hidden></div>

  <section class="hero">
    <div class="card">
      <h2><span data-i18n="lastNight">การนอนคืนล่าสุด</span> <span id="sleepDate" class="sub"></span></h2>
      <div id="sleepHero"><div class="kpi-empty" data-i18n="noData">ยังไม่มีข้อมูล</div></div>
    </div>
    <div class="card">
      <div class="row between" style="margin-bottom:12px">
        <div><h2 data-i18n="keyToday">ค่าสำคัญวันนี้</h2><div class="sub" data-i18n="keySub"></div></div>
        <div class="row">
          <select id="days"><option value="3">3</option><option value="7" selected>7</option><option value="14">14</option><option value="30">30</option></select>
          <button id="refresh" class="primary"><span data-i18n="refresh">↻ ดึงข้อมูล</span></button>
        </div>
      </div>
      <div id="tiles" class="tiles"></div>
      <div id="refreshResult" class="sub" style="margin-top:10px"></div>
    </div>
  </section>

  <section class="card chart" id="sleepChartCard">
    <div class="row between">
      <div><h2 data-i18n="sleep14">ช่วงการนอน 14 คืน</h2><div class="sub" data-i18n="sleep14Sub"></div></div>
      <div class="legend"><span><i style="background:var(--sleep-deep)"></i><span data-i18n="deep">หลับลึก</span></span><span><i style="background:var(--sleep-rem)"></i>REM</span><span><i style="background:var(--sleep-light)"></i><span data-i18n="light">หลับตื้น</span></span><span><i style="background:var(--sleep-awake)"></i><span data-i18n="awake">ตื่น</span></span></div>
    </div>
    <svg id="sleepChart" role="img"></svg>
    <div class="tip" id="tip"></div>
  </section>

  <section class="card" id="daySec" hidden>
    <div class="row between">
      <div><h2><span data-i18n="dayDetail">รายละเอียดวัน</span> <span id="dayTitle"></span></h2><div id="dayMissing" class="sub"></div></div>
      <button id="dayClose" class="ghost" data-i18n="close">ปิด</button>
    </div>
    <div class="wrap"><table id="dayTable"><thead><tr><th>metric</th><th class="num">value</th><th>unit</th><th>status</th><th data-i18n="measured">measured</th><th>raw</th></tr></thead><tbody></tbody></table></div>
  </section>

  <section class="card">
    <div class="row between">
      <div><h2 data-i18n="googleConn">การเชื่อมต่อ Google</h2><div id="status" class="sub"></div></div>
      <div class="row"><button id="connect" data-i18n="connect">เชื่อมต่อ / เชื่อมต่อใหม่</button><button id="devices" class="ghost" data-i18n="devices">อุปกรณ์</button></div>
    </div>
  </section>

  <section class="card">
    <details id="rawDetails">
      <summary><div><h2 style="margin:0" data-i18n="rawTitle">ข้อมูลดิบจาก API</h2><div class="sub" data-i18n="rawSub"></div></div></summary>
      <div class="row" style="margin-top:12px; justify-content:flex-end"><button id="ctxBtn" class="ghost" data-i18n="coachSees">สิ่งที่ coach เห็น</button><button id="rawReload" class="ghost" data-i18n="reload">โหลดใหม่</button></div>
      <div class="wrap"><table id="rawTable"><thead><tr><th>id</th><th>fetched</th><th>type</th><th>method</th><th>status</th><th class="num">items</th><th class="num">ms</th><th>range</th></tr></thead><tbody></tbody></table></div>
      <pre id="rawView" hidden></pre>
    </details>
  </section>
</main>

<aside class="coach" id="coach">
  <div class="coach-head">
    <div class="avatar"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3m0 12v3M3 12h3m12 0h3"/><circle cx="12" cy="12" r="5"/></svg></div>
    <div style="flex:1; min-width:0"><b data-i18n="coachTitle">AI Coach</b><small id="coachInfo">…</small></div>
    <button id="coachClear" class="icon ghost" data-i18n-title="clearChat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    <button id="coachClose" class="icon ghost" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="chips" id="chips"></div>
  <div class="compose">
    <textarea id="chatIn" rows="1" data-i18n-ph="askPh"></textarea>
    <button id="send" class="primary icon" aria-label="send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
</aside>
</div>
<div class="scrim" id="scrim"></div>
<button class="fab" id="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span data-i18n="coachTitle">AI Coach</span></button>

<script>
/* ---------- i18n ---------- */
const I18N = {
  th: {
    title: 'Health Coach', useToken: 'ใช้ token', lastNight: 'การนอนคืนล่าสุด', noData: 'ยังไม่มีข้อมูล', keyToday: 'ค่าสำคัญวันนี้',
    keySub: 'เส้นเล็ก = 14 วันล่าสุด · เทียบกับค่าเฉลี่ย 7 วันก่อนหน้า', refresh: '↻ ดึงข้อมูล', sleep14: 'ช่วงการนอน 14 คืน', sleep14Sub: 'นาทีต่อคืน แยกตามระยะ · แตะแท่งเพื่อดูรายละเอียด',
    deep: 'หลับลึก', light: 'หลับตื้น', awake: 'ตื่น', asleep: 'หลับ', dayDetail: 'รายละเอียดวัน', close: 'ปิด', measured: 'เวลาที่วัด', googleConn: 'การเชื่อมต่อ Google',
    connect: 'เชื่อมต่อ / เชื่อมต่อใหม่', devices: 'อุปกรณ์', rawTitle: 'ข้อมูลดิบจาก API', rawSub: 'response ทุกครั้งที่ดึง เก็บไว้ตรวจสอบย้อนหลัง · รวมสิ่งที่ AI coach เห็น',
    coachSees: 'สิ่งที่ coach เห็น', reload: 'โหลดใหม่', coachTitle: 'AI Coach', clearChat: 'ล้างประวัติ', askPh: 'ถามโค้ช…',

/* ---------- state & helpers ---------- */
const state = { token: '', rows: [], byDay: {}, days: [], streaming: false };

const TILES = [

  { m: 'rhr_bpm', k: 'm_rhr', unit: 'bpm', color: 'var(--s-rhr)', upGood: false, dec: 0 },
  { m: 'spo2_avg_pct', k: 'm_spo2', unit: '%', color: 'var(--s-spo2)', upGood: true, dec: 1 },
  { m: 'respiratory_rate_bpm', k: 'm_rr', unit: '/min', color: 'var(--s-rr)', upGood: null, dec: 1 },
  { m: 'steps', k: 'm_steps', unit: '', color: 'var(--s-steps)', upGood: true, dec: 0 },
  { m: 'active_zone_minutes', k: 'm_azm', unit: 'min', color: 'var(--s-azm)', upGood: true, dec: 0 },

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'x-admin-token': state.token, ...(opts.headers || {}) } });
  const text = await res.text();
  let body; try { body = JSON.parse(text); } catch { body = text; }
  if (!res.ok) throw Object.assign(new Error(`${res.status} ${typeof body === 'string' ? body : (body.message || JSON.stringify(body))}`), { status: res.status, body });
  return body;
}
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const local = (iso) => iso ? new Date(iso).toLocaleString('sv-SE').slice(0, 16) : '';
const clock = (iso) => iso ? new Date(iso).toLocaleTimeString(LOC(), { hour: '2-digit', minute: '2-digit' }) : '—';
const thDate = (d) => new Date(d + 'T00:00:00').toLocaleDateString(LOC(), { weekday: 'short', day: 'numeric', month: 'short' });
const num = (v, dec = 0) => v === null || v === undefined ? null : Number(v).toLocaleString('en-US', { maximumFractionDigits: dec });
const hm = (min) => min === null ? '—' : `${Math.floor(min / 60)} ${t('hrs')} ${Math.round(min % 60)} ${t('min')}`;
const val = (day, m) => { const r = state.byDay[day]?.[m]; return r && r.status !== 'missing' && r.value !== null ? Number(r.value) : null; };

function banner(msg, cls = '') { const b = $('#banner'); b.hidden = !msg; b.className = 'banner ' + cls; b.innerHTML = msg || ''; }

/* ---------- status ---------- */
async function loadStatus() {
  const c = $('#conn');
  try {
    const s = await api('/auth/google/status');
    if (!s.connected) { c.className = 'pill bad'; c.lastElementChild.textContent = t('notConnected'); $('#status').textContent = t('statusNone'); banner(t('bannerConnect'), 'warn'); return; }
    c.className = 'pill ' + (s.needsReconnect ? 'warn' : 'ok'); c.lastElementChild.textContent = s.needsReconnect ? t('reconnect') : t('connected');
    $('#status').innerHTML = `${t('connectedAt')} ${esc(local(s.connectedAt))} · ${t('lastRefresh')} ${esc(local(s.lastRefreshAt))}` + (s.lastError ? `<br><span class="bad">${t('lastError')} (${esc(local(s.lastErrorAt))}): ${esc(s.lastError)}</span>` : '');
    banner(s.needsReconnect ? t('bannerReconnect') : '', 'bad');
  } catch (e) { c.className = 'pill bad'; c.lastElementChild.textContent = e.status === 401 ? t('badToken') : t('apiDown'); $('#status').textContent = e.message; if (e.status === 401) $('#tokenBox').hidden = false; }
}

/* ---------- data ---------- */
async function loadData() {
  state.rows = await api('/api/days?days=21');
  state.byDay = {};
  for (const r of state.rows) (state.byDay[r.day.slice(0, 10)] ||= {})[r.metric] = r;
  state.days = Object.keys(state.byDay).sort();
  renderAll();
}
function renderAll() { renderSleepHero(); renderTiles(); renderSleepChart(); }
function latestDayWith(m) { for (let i = state.days.length - 1; i >= 0; i--) if (val(state.days[i], m) !== null) return state.days[i]; return null; }

function renderSleepHero() {
  const d = latestDayWith('sleep_minutes_asleep');
  $('#sleepDate').textContent = d ? `· ${t('wake')} ${thDate(d)}` : '';
  if (!d) { $('#sleepHero').innerHTML = `<div class="kpi-empty">${t('noSleep')}</div>`; return; }
  const asleep = val(d, 'sleep_minutes_asleep'), eff = val(d, 'sleep_efficiency_pct');
  const deep = val(d, 'sleep_deep_minutes'), rem = val(d, 'sleep_rem_minutes'), light = val(d, 'sleep_light_minutes'), awake = val(d, 'sleep_minutes_awake');
  const s = state.byDay[d].sleep_minutes_asleep?.measured_start, e = state.byDay[d].sleep_minutes_asleep?.measured_end;
  const base7 = mean(state.days.filter(x => x < d).slice(-7).map(x => val(x, 'sleep_minutes_asleep')).filter(x => x !== null));
  const delta = base7 !== null && asleep !== null ? asleep - base7 : null;
  const partial = state.byDay[d].sleep_minutes_asleep?.status === 'partial';
  const hasStages = [deep, rem, light].some(x => x !== null);
  const tot = hasStages ? [deep, rem, light, awake].filter(x => x !== null).reduce((a, b) => a + b, 0) : 0;
  const n0 = (v) => v === null ? '—' : num(v);
  const seg = (v, c) => v === null || !tot ? '' : `<span style="width:${(v / tot * 100).toFixed(1)}%; background:${c}"></span>`;
  $('#sleepHero').innerHTML = `
    <div class="hero-num">${asleep === null ? '—' : `${Math.floor(asleep / 60)}<small>${t('hrs')}</small>${Math.round(asleep % 60)}<small>${t('min')}</small>`}</div>
    <div class="sub">${esc(clock(s))} → ${esc(clock(e))} · ${t('eff')} ${eff === null ? '—' : eff.toFixed(0) + '%'}${partial ? ` · <span class="warn">${t('multiSession')}</span>` : ''}</div>
    <div style="font-size:13px; margin-top:6px">${delta === null ? `<span class="muted">${t('noBaseline')}</span>` : `<span class="${delta >= 0 ? 'ok' : 'warn'}">${delta >= 0 ? '▲' : '▼'} ${hm(Math.abs(delta))}</span> <span class="muted">${t('vs7')} (${hm(base7)})</span>`}</div>
    ${tot ? `<div class="stage-bar">${seg(deep, 'var(--sleep-deep)')}${seg(rem, 'var(--sleep-rem)')}${seg(light, 'var(--sleep-light)')}${seg(awake, 'var(--sleep-awake)')}</div>
    <div class="legend"><span><i style="background:var(--sleep-deep)"></i>${t('deep')} ${n0(deep)}</span><span><i style="background:var(--sleep-rem)"></i>REM ${n0(rem)}</span><span><i style="background:var(--sleep-light)"></i>${t('light')} ${n0(light)}</span><span><i style="background:var(--sleep-awake)"></i>${t('awake')} ${n0(awake)} <span class="muted">${t('minutes')}</span></span></div>` : `<div class="missing">${t('noStages')}</div>`}`;
}

function sparkline(days, m, color) {
  const pts = days.map((d, i) => [i, val(d, m)]);
  const have = pts.filter(p => p[1] !== null);
  if (have.length < 2) return '<svg viewBox="0 0 100 38"></svg>';
  const W = 100, H = 38, pad = 5;
  const ys = have.map(p => p[1]), lo = Math.min(...ys), hi = Math.max(...ys), span = hi - lo || 1;
  const x = (i) => pad + i / (days.length - 1) * (W - 2 * pad), y = (v) => H - pad - (v - lo) / span * (H - 2 * pad);
  let d = '', prev = false;
  for (const [i, v] of pts) { if (v === null) { prev = false; continue; } d += `${prev ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`; prev = true; }
  const last = have[have.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(last[0]).toFixed(1)}" cy="${y(last[1]).toFixed(1)}" r="4" fill="${color}" stroke="var(--surface-2)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

function renderTiles() {
  const days14 = state.days.slice(-14);
  $('#tiles').innerHTML = TILES.map(tl => {
    const d = latestDayWith(tl.m); const v = d ? val(d, tl.m) : null;
    const base = d ? mean(state.days.filter(x => x < d).slice(-7).map(x => val(x, tl.m)).filter(x => x !== null)) : null;
    let delta = '<span class="muted">—</span>';
    if (v !== null && base !== null) {
      const diff = v - base, pct = base ? diff / base * 100 : 0;
      const good = tl.upGood === null ? null : (diff >= 0) === tl.upGood;
      delta = `<span class="${good === null ? '' : good ? 'ok' : 'warn'}">${diff >= 0 ? '▲' : '▼'} ${Math.abs(pct) >= 1 ? Math.abs(pct).toFixed(0) + '%' : num(Math.abs(diff), tl.dec)}</span> <span class="muted">${t('vs7s')}</span>`;
    }
    const stale = d && d !== state.days[state.days.length - 1];
    return `<div class="tile">
      <div class="label"><i style="background:${tl.color}"></i>${t(tl.k)}</div>${stale ? `<div class="stale">${t('latest')} ${thDate(d)}</div>` : ''}
      <div class="value">${v === null ? `<span class="missing">${t('noData')}</span>` : `${num(v, tl.dec)}<small>${tl.unit}</small>`}</div>
      <div class="delta">${delta}</div>
      ${sparkline(days14, tl.m, tl.color)}</div>`;
  }).join('');
}

function renderSleepChart() {
  const svg = $('#sleepChart');
  const days = state.days.slice(-14);
  const W = svg.clientWidth || 800, H = 220, L = 40, R = 8, T = 10, B = 28;
  const stages = [['sleep_deep_minutes', 'var(--sleep-deep)', t('deep')], ['sleep_rem_minutes', 'var(--sleep-rem)', 'REM'], ['sleep_light_minutes', 'var(--sleep-light)', t('light')], ['sleep_minutes_awake', 'var(--sleep-awake)', t('awake')]];
  const totals = days.map(d => stages.reduce((a, [m]) => a + (val(d, m) ?? 0), 0));
  const asleepOnly = days.map(d => val(d, 'sleep_minutes_asleep'));
  const yMax = Math.ceil(Math.max(480, ...totals, ...asleepOnly.map(x => x ?? 0)) / 60) * 60;
  const slot = (W - L - R) / Math.max(days.length, 1), bw = Math.min(24, slot * .6);
  const y = (v) => T + (H - T - B) * (1 - v / yMax);

  for (let v = 0; v <= yMax; v += 120) out += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--hair)"/><text x="${L - 8}" y="${y(v) + 4}" font-size="11" fill="var(--muted)" text-anchor="end">${v / 60}${t('hrs')}</text>`;
  out += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/>`;
  days.forEach((d, i) => {
    const cx = L + slot * (i + .5), x0 = cx - bw / 2;
    let acc = 0; const segs = stages.map(([m, c, lab]) => [val(d, m), c, lab]).filter(s => s[0] !== null && s[0] > 0);
    if (!segs.length && asleepOnly[i] !== null) segs.push([asleepOnly[i], 'var(--sleep-rem)', t('asleep')]);
    segs.forEach(([v, c], k) => {
      const yTop = y(acc + v), yBot = y(acc) - (k > 0 ? 2 : 0), r = k === segs.length - 1 ? 4 : 0;
      out += `<path d="M${x0},${yBot} V${yTop + r} q0,-${r} ${r},-${r} H${x0 + bw - r} q${r},0 ${r},${r} V${yBot} Z" fill="${c}" data-i="${i}"/>`;
      acc += v;
    });
    if (!segs.length) out += `<text x="${cx}" y="${y(0) - 6}" font-size="11" fill="var(--muted)" text-anchor="middle">–</text>`;
    out += `<rect x="${L + slot * i}" y="${T}" width="${slot}" height="${H - T - B}" fill="transparent" data-i="${i}" style="cursor:pointer"/>`;
    if (slot > 34 || i % 2 === 0) out += `<text x="${cx}" y="${H - 8}" font-size="11" fill="var(--muted)" text-anchor="middle">${+d.slice(8)}/${+d.slice(5, 7)}</text>`;
  });
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = out;
  const tip = $('#tip'), card = $('#sleepChartCard');
  const show = (i) => {
    const d = days[i]; const rows = stages.map(([m, c, lab]) => [val(d, m), c, lab]).filter(s => s[0] !== null);
    tip.innerHTML = `<b>${esc(thDate(d))}</b> · ${hm(asleepOnly[i])}` + rows.map(([v, c, lab]) => `<div class="r"><span><i style="background:${c}"></i>${lab}</span><span>${num(v)} ${t('min')}</span></div>`).join('') +
      (val(d, 'sleep_efficiency_pct') !== null ? `<div class="r"><span>${t('eff')}</span><span>${val(d, 'sleep_efficiency_pct').toFixed(0)}%</span></div>` : '');
    const rc = card.getBoundingClientRect(), sr = svg.getBoundingClientRect();
    const cx = sr.left - rc.left + (L + slot * (i + .5)) / W * sr.width, right = i < days.length / 2;
    tip.style.transform = right ? 'translate(18px, -50%)' : 'translate(calc(-100% - 18px), -50%)';
    tip.style.left = `${cx}px`; tip.style.top = `${sr.top - rc.top + (T + (H - T - B) / 2) * sr.height / H}px`; tip.style.opacity = 1;
  };
  svg.onmousemove = (ev) => { const i = ev.target.dataset.i; if (i === undefined) tip.style.opacity = 0; else show(+i); };
  svg.onmouseleave = () => { tip.style.opacity = 0; };

}
let rs; window.addEventListener('resize', () => { clearTimeout(rs); rs = setTimeout(() => state.days.length && renderSleepChart(), 120); });

/* ---------- day detail / raw ---------- */
async function loadDay(day) {
  const d = await api(`/api/days/${day}`);
  $('#daySec').hidden = false; $('#dayTitle').textContent = `${day} (${thDate(day)})`;
  $('#dayMissing').innerHTML = d.missing.length ? `${t('missingN')} ${d.missing.length} ${t('items')}: <span class="bad">${esc(d.missing.join(', '))}</span>` : `<span class="ok">${t('allOk')}</span>`;
  $('#dayTable tbody').innerHTML = d.metrics.map(m => `<tr><td>${esc(m.metric)}</td><td class="num">${m.unit === 'iso8601' ? esc(local(m.details?.iso)) : (m.status === 'missing' || m.value === null ? '<span class="missing">—</span>' : num(m.value, 1))}</td><td class="muted">${esc(m.unit)}</td>
    <td class="${m.status === 'ok' ? 'ok' : m.status === 'partial' ? 'warn' : 'bad'}">${esc(m.status)}${m.status_reason ? ` <span class="muted">(${esc(m.status_reason)})</span>` : ''}</td>
    <td class="muted">${esc(local(m.measured_start))}${m.measured_end ? ' → ' + esc(local(m.measured_end)) : ''}</td>

  $('#dayTable').querySelectorAll('a[data-raw]').forEach(a => a.onclick = () => viewRaw(a.dataset.raw));

}
$('#dayClose').onclick = () => { $('#daySec').hidden = true; };
async function loadRaw() {

  $('#rawTable').querySelectorAll('a[data-raw]').forEach(a => a.onclick = () => viewRaw(a.dataset.raw));
}
function showJson(o) { $('#rawDetails').open = true; $('#rawView').hidden = false; $('#rawView').textContent = JSON.stringify(o, null, 2); $('#rawView').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
async function viewRaw(id) { showJson(await api(`/api/raw/${id}`)); }
$('#ctxBtn').onclick = async () => { try { showJson(await api('/api/coach/context')); } catch (e) { showErr(e); } };

/* ---------- coach chat ---------- */
function md(s) {
  const lines = esc(s).split('\n'); let html = '', inList = false;
  for (const ln of lines) {
    const b = ln.match(/^\s*[-•*]\s+(.*)/);
    if (b) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${b[1]}</li>`; continue; }
    if (inList) { html += '</ul>'; inList = false; }
    if (ln.trim()) html += `<p>${ln.replace(/^#+\s*/, '')}</p>`;
  }
  if (inList) html += '</ul>';
  return html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}
function stamp(d) { return `<span class="time">${esc(new Date(d).toLocaleString(LOC(), { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }))}</span>`; }
function addMsg(role, text, opts = {}) {
  const el = document.createElement('div');
  el.className = `msg ${role === 'user' ? 'user' : 'ai'}${opts.error ? ' err' : ''}`;
  el.innerHTML = (role === 'user' ? esc(text) : md(text)) + (opts.time ? stamp(opts.time) : '');
  $('#msgs').appendChild(el); scrollMsgs(); return el;
}
function scrollMsgs() { const m = $('#msgs'); m.scrollTo({ top: m.scrollHeight, behavior: 'smooth' }); }
async function loadCoach() {
  try {
    const info = await api('/api/coach/info');
    $('#coachInfo').textContent = info.configured ? `${info.model} · ${info.promptVersion}` : t('coachOff');
  } catch { $('#coachInfo').textContent = '—'; }
  try {
    const hist = await api('/api/coach/messages');
    const box = $('#msgs'); box.innerHTML = '';
    if (!hist.length) box.innerHTML = `<div class="coach-empty">${t('coachEmpty')}</div>`;
    for (const m of hist) addMsg(m.role, m.content, { time: m.created_at, error: !!m.error });
  } catch { $('#msgs').innerHTML = `<div class="coach-empty">${t('coachEmpty')}</div>`; }
}
async function sendChat(text) {
  text = (text || '').trim(); if (!text || state.streaming) return;
  state.streaming = true; $('#send').disabled = true; $('#chatIn').value = ''; autosize();
  $('#msgs').querySelector('.coach-empty')?.remove();
  addMsg('user', text, { time: Date.now() });
  const typing = document.createElement('div'); typing.className = 'msg ai typing'; typing.innerHTML = '<i></i><i></i><i></i>'; $('#msgs').appendChild(typing); scrollMsgs();
  let el = null, acc = '';
  try {
    const res = await fetch('/api/coach/chat', { method: 'POST', headers: { 'content-type': 'application/json', 'x-admin-token': state.token }, body: JSON.stringify({ message: text, lang }) });
    if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx; while ((idx = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
        if (!chunk.startsWith('data:')) continue;
        const j = JSON.parse(chunk.slice(5));
        if (j.delta) { if (!el) { typing.remove(); el = addMsg('assistant', ''); } acc += j.delta; el.innerHTML = md(acc); scrollMsgs(); }
        if (j.error) { typing.remove(); addMsg('assistant', j.error, { error: true }); }
      }
    }
    if (el) el.innerHTML = md(acc) + stamp(Date.now());
  } catch (e) { typing.remove(); addMsg('assistant', e.message, { error: true }); }
  finally { state.streaming = false; $('#send').disabled = false; $('#chatIn').focus(); }
}
function autosize() { const ta = $('#chatIn'); ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 140) + 'px'; }
$('#chatIn').addEventListener('input', autosize);
$('#chatIn').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat($('#chatIn').value); } });
$('#send').onclick = () => sendChat($('#chatIn').value);
$('#coachClear').onclick = async () => { if (!confirm(t('clearConfirm'))) return; await api('/api/coach/messages', { method: 'DELETE' }); loadCoach(); };
const openCoach = (on) => { $('#coach').classList.toggle('open', on); $('#scrim').classList.toggle('on', on); $('#coachClose').style.display = on ? '' : 'none'; if (on) setTimeout(scrollMsgs, 350); };
$('#fab').onclick = () => openCoach(true); $('#scrim').onclick = () => openCoach(false); $('#coachClose').onclick = () => openCoach(false);

/* ---------- actions ---------- */
function showErr(e) { $('#refreshResult').innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
async function loadAll() { await loadStatus(); await Promise.all([loadData().catch(showErr), loadRaw().catch(() => {}), loadCoach()]); }
$('#save').onclick = () => { state.token = $('#tok').value.trim(); try { sessionStorage.setItem('adminToken', state.token); } catch {} $('#tokenBox').hidden = !!state.token; banner(''); loadAll(); };
$('#tokBtn').onclick = () => { $('#tokenBox').hidden = !$('#tokenBox').hidden; if (!$('#tokenBox').hidden) $('#tok').focus(); };
$('#connect').onclick = () => { location.href = `/auth/google/start?token=${encodeURIComponent(state.token)}`; };
$('#devices').onclick = async () => { try { showJson(await api('/api/devices')); } catch (e) { showErr(e); } };
$('#refresh').onclick = async () => {
  const b = $('#refresh'); b.disabled = true; $('#refreshResult').textContent = t('fetching');
  try {
    const r = await api(`/api/refresh?days=${$('#days').value}`, { method: 'POST' });
    const bad = r.perType.filter(x => !x.ok);
    $('#refreshResult').innerHTML = `${t('fetched')} ${esc(r.range.startDate)} → ${esc(r.range.endDate)} · ` + r.perType.map(x => `<span class="${x.ok ? 'ok' : 'bad'}" title="${esc(x.error || '')}">${esc(x.dataType)} ${x.ok ? x.items : 'ERR ' + x.httpStatus}</span>`).join(' · ') +
      (bad.length && bad[0].error ? `<br><span class="bad">${esc(bad[0].error)}</span>` : '');
    await loadAll();
  } catch (e) { showErr(e); } finally { b.disabled = false; }
};
$('#rawReload').onclick = () => loadRaw().catch(showErr);
document.querySelectorAll('#langSeg button').forEach(b => b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem('lang', lang); } catch {} applyLang(); renderAll(); loadCoach(); });

applyLang(); $('#msgs').innerHTML = `<div class="coach-empty">${t('coachEmpty')}</div>`;
if (new URLSearchParams(location.search).get('connected')) { banner(t('bannerDone')); history.replaceState(null, '', '/ui'); }
if (state.token) loadAll(); else { $('#tokenBox').hidden = false; banner(t('bannerToken')); }
</script>
</body>
